[package]
name = "rust-email-mcp"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Bounded IMAP/SMTP MCP server with durable send tracking and OIDC authentication"

[dependencies]
anyhow = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
axum = "0.8"
base64 = "0.22"
futures = "0.3"
imap-proto = "0.17"
html5ever = { version = "0.40.1", default-features = false }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
mailparse = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=3.8.0", features = ["server", "transport-streamable-http-server"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["limit", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
charset = "0.1.5"

[dev-dependencies]
tempfile = "3"
aws-lc-rs = "1"
rcgen = "0.14.10"

[patch.crates-io]
async-imap = { path = "vendor/async-imap" }

[profile.release]
lto = "thin"
strip = true
